[build-system]
requires = ["setuptools>=67.5", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypermri"
dynamic = ["version"]
requires-python = ">=3.10.0"
dependencies = [
    "numpy >= 1.19.5",
    "brukerapi@git+https://github.com/LucaNagel/brukerapi-python/#egg=read_in_complex_2dseq",
    "matplotlib >= 3.9",
    "pydicom>=3.0.0",
    "nbclassic >= 0.5.3",
    "notebook >= 6.5.0",
    "jupyterlab >= 3.6.1",
    "ipywidgets >= 8.0.4",
    "scipy >= 1.9.1",
    "ipympl >= 0.9.3",
    "tqdm >= 4.65.0",
    "pandas >= 1.5.3",
    "openpyxl",
    "xarray >=2024.3.0",
    "lmfit",
    "cmcrameri",
    "GitPython",
    "SciencePlots",
    "PyYAML",
    "cmap",
]

readme = "README.md"
license = {text="MIT License"}
description = "Schilling-AG python module to work with Bruker MRI data"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: Apache License",
    "Intended Audience :: Science/Research",
]
authors = [
  {name="Andre Wendlinger", email="andre.wendlinger@tum.de"},
  {name="Wolfgang Gottwald", email="wolfgang.gottwald@tum.de"},
    {name="Luca Nagel", email="luca.nagel@tum.de"},
    {name="Jakob Gaubatz", email="jakob.gaubatz@tum.de"},
    {name="Miriam Kirst", email="miriam.kirst@tum.de"},
    {name="Ben Georges Danzer", email="ben.danzer@tum.de"},
    {name="Jacopo Frignani",email="jacopo.frignani@tum.de"}


]

[project.optional-dependencies]
dev = [
  "pip-tools >= 7.4.1",
  "pytest >= 7.2.2",
  "pytest-cov >= 4.0.0",
  "tox >= 4.4.6",
  "mypy >= 0.910",
  "bandit >= 1.7.0",
  "pre-commit >= 2.15.0",
  "yamllint >= 1.32.0",
  "tomli >= 1.2.0",
  "ruff >= 0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# YAML/JSON configs are read at runtime (smart loading, reconstruction, plotters)
[tool.setuptools.package-data]
hypermri = ["config/*.json", "*/config/*.yaml"]

[tool.setuptools_scm]
# allows installing from a plain copy without git history
fallback_version = "0.0.0"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Also enable flake8-bugbear (`B`) for common bugs.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E402", # Module level import not at top of file
    "F403", # 'from module import *' used; unable to detect undefined names
    "F405", # 'name' may be undefined, or defined from star imports
    "E722", # Do not use bare `except`
    "B028", # No explicit `stacklevel` keyword argument found
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err`
    "F401", # Unused imports (noisy in __init__)
    "B007", # Unused loop variables
    "E741", # Ambiguous variable names (l, I)
    "B018", # Useless expressions
    "B027", # Empty method in ABC without @abstractmethod
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Black configuration is now handled by [tool.ruff.format]
# isort configuration is now handled by [tool.ruff.lint.isort]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_equality = false
disable_error_code = ["var-annotated", "assignment", "method-assign", "unreachable", "attr-defined", "import-not-found"]

[[tool.mypy.overrides]]
module = [
    "brukerapi.*",
    "mapvbvd.*",
    "IPython.*",
    "git.*",
    "nmrglue.*",
    "dipy.*",
    "specutils.*",
    "astropy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose --tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests (fast, use mock data)",
    "integration: Integration tests (require real MRI data)",
    "slow: Slow tests (may take several minutes)",
    "vendor_bruker: Tests specific to Bruker data",
    "vendor_siemens: Tests specific to Siemens data",
    "vendor_agilent: Tests specific to Agilent data",
    "spectroscopy: Tests for spectroscopy functionality",
    "anatomical: Tests for anatomical imaging functionality",
]
filterwarnings = [
    "ignore::DeprecationWarning:hypermri.*",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:matplotlib.*",
    "ignore::UserWarning:nmrglue.*",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/hypermri"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "scripts/hooks"]
skips = ["B101"]  # Skip assert_used test
